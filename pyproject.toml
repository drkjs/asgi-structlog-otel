[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asgi-structlog-otel"
version = "0.1.0"
description = "Automatic OpenTelemetry trace correlation for structured logging in ASGI applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

# Core dependencies - kept minimal for maximum compatibility
dependencies = [
    "structlog>=23.1.0",
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
# Full instrumentation with SDK (for standalone usage)
sdk = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-asgi>=0.41b0",
]

# Google Cloud Platform support
gcp = [
    "google-cloud-logging>=3.5.0",
]

# AWS support (for future)
aws = [
    "boto3>=1.28.0",
]

# All vendor plugins
all = [
    "asgi-structlog-otel[sdk,gcp,aws]",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",  # For testing ASGI apps
    "fastapi>=0.100.0",  # For integration tests
    "uvicorn>=0.23.0",  # For integration tests
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asgi_structlog_otel"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

# Ruff configuration (replaces flake8, isort, and black)
[tool.ruff]
line-length = 100
target-version = "py311"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
